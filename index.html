:root{

*{box-sizing:border-box}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

#app{max-width:32rem;margin:0 auto;padding-inline:20px;padding-block:56px 110px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:10px;font-weight:300;color:color-mix(in srgb,var(--mute) 40%,transparent);letter-spacing:.2em;margin:0}
h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0;color:var(--ink)}
.card{background:var(--card);border-radius:14px;padding:20px;position:relative;box-shadow:0 2px 12px rgba(10,31,68,.06),0 1px 3px rgba(10,31,68,.04),inset 0 1px 0 rgba(255,255,255,.8)}

.topbar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0;background:linear-gradient(to right,var(--navy),rgba(201,164,91,.6),var(--navy))}
.h3{font-size:12px;font-weight:500;color:color-mix(in srgb,var(--mute) 60%,transparent);letter-spacing:.1em;margin:0}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}

.modal .in{background-color:var(--soft);padding:10px 12px;box-shadow:none}
.modal select.in{height:40px}
textarea.in{resize:none;overflow:hidden;display:block}
.btn{border-radius:12px;padding:12px 20px;font-weight:500;font-size:14px;transition:transform .08s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.5}
.btn.primary{background:var(--navy);color:#fff;border:1px solid rgba(201,164,91,.3);box-shadow:0 3px 10px rgba(10,31,68,.2),0 1px 3px rgba(10,31,68,.12)}
.btn.goldb{background:linear-gradient(to bottom,var(--gold),var(--gold-d));color:#fff;border:1px solid rgba(201,164,91,.2);box-shadow:0 3px 10px rgba(201,164,91,.25),0 1px 3px rgba(201,164,91,.15)}
.btn.secondary{background:#fff;color:var(--navy);border:1px solid rgba(201,164,91,.4);box-shadow:0 2px 8px rgba(10,31,68,.06)}
.btn.danger{background:#fff;color:var(--red);border:1px solid rgba(192,57,43,.2);box-shadow:0 2px 8px rgba(192,57,43,.08)}
.w100{width:100%}
.chipbtn{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;background:rgba(10,31,68,.05);color:rgba(10,31,68,.6);font-size:11px;font-weight:500}

.ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.bar{height:4px;background:var(--bg);border-radius:99px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s}
.sub{font-size:11px;font-weight:300;color:color-mix(in srgb,var(--mute) 50%,transparent);margin:0}
.kebab{padding:6px;border-radius:8px;background:rgba(10,31,68,.05);color:rgba(10,31,68,.5);display:flex}
.fbox{background:var(--soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.flbl{font-size:10px;font-weight:500;color:color-mix(in srgb,var(--mute) 60%,transparent);letter-spacing:.05em}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:4px 10px;border-radius:7px;font-size:12px;font-weight:500;background:#fff;color:var(--mute);border:1px solid var(--line)}

.pill.n{background:var(--navy);color:#fff;border-color:var(--navy)}

.tog.on i::after{transform:translateX(-10px)}

.cal .dow{text-align:center;font-size:10px;font-weight:500;color:color-mix(in srgb,var(--mute) 50%,transparent);padding:4px 0}
.cal .d{height:32px;border-radius:7px;font-size:12px;font-weight:500;color:var(--ink);position:relative}
.cal .d:disabled{color:var(--line)}
.cal .d.sel{background:var(--gold);color:#fff}
.cal .d.ok:not(.sel)::after{content:"";position:absolute;bottom:3px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:rgba(201,164,91,.6)}
.cal .nav{padding:4px;border-radius:8px;display:flex}
.cal .nav:disabled{opacity:.2}
.symsel{position:relative;width:48px;height:44px;flex:none;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;box-shadow:inset 0 2px 4px rgba(10,31,68,.04)}
.symsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.amt{position:relative;flex:1;min-width:0}

.amt .in{padding-right:32px}
.hint{font-size:11px;font-weight:300;color:var(--gold);margin:0}
.dash{width:100%;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--line);border-radius:10px;color:color-mix(in srgb,var(--mute) 50%,transparent);font-size:12px}
.thumb{position:relative;height:44px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;left:4px;padding:2px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex}
.sq{padding:8px;border-radius:10px;display:flex}
.badge{font-size:9px;font-weight:500;padding:2px 8px;border-radius:99px;flex:none}
.b-active{background:rgba(10,31,68,.1);color:var(--navy)} .b-completed{background:rgba(201,164,91,.1);color:var(--gold)} .b-planned{background:rgba(80,83,90,.1);color:var(--mute)}
.b-show{background:rgba(201,164,91,.15);color:var(--gold)}

.tile{width:64px;height:64px;border-radius:16px;background:rgba(10,31,68,.05);display:flex;align-items:center;justify-content:center;margin-bottom:20px;color:rgba(10,31,68,.4)}

.sw{width:40px;height:24px;border-radius:99px;background:var(--line);display:flex;align-items:center;padding:0 2px;transition:background .15s}
.sw::after{content:"";width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}

.datebox{position:relative;height:48px;min-width:0}
.datebox .face{position:absolute;inset:0;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;padding:0 36px 0 12px;font-size:16px;pointer-events:none;box-shadow:inset 0 2px 4px rgba(10,31,68,.04)}
.datebox svg{position:absolute;right:12px;top:50%;margin-top:-8px;color:color-mix(in srgb,var(--mute) 40%,transparent);pointer-events:none}
.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.datebox .clr{position:absolute;right:8px;top:50%;margin-top:-10px;z-index:2;padding:2px;display:flex;color:color-mix(in srgb,var(--mute) 50%,transparent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}
</style>

const newCat = (bind, f) => f.addCat ? `<div class="row"><input class="in" style="padding:8px 12px;border-color:rgba(201,164,91,.5)" id="${bind}-newcat" data-m="${bind}.newCat" data-enter="savecat" data-v="${bind}" placeholder="שם הקטגוריה..." value="${h(f.newCat)}"><button class="sq" style="background:var(--gold);color:#fff" data-a="savecat" data-v="${bind}" aria-label="שמור קטגוריה">${ic('plus', 'stroke-width:2')}</button><button class="sq" style="background:var(--bg);color:var(--mute)" data-a="cancelcat" data-v="${bind}" aria-label="ביטול">${ic('x', 'stroke-width:2')}</button></div>` : '';
const hintTxt = (f, t) => { const v = f.amount ? conv(parseFloat(f.amount), f.currency, t) : 0; return f.currency !== 'ILS' && v > 0 ? `≈ ₪${il(f.refund ? -v : v)}` : ''; };
function addForm(t) {
  const f = ensureAdd(t), hint = hintTxt(f, t);
  return `<div class="card gold"><h3 class="h3" style="margin-bottom:16px">הוספת הוצאה</h3><div style="display:flex;flex-direction:column;gap:12px">

    <div class="row" style="align-items:flex-start"><div class="field grow"><label class="lbl" for="a-cat">קטגוריה</label>${catSel('a-cat', t, f, 'add')}</div>${assets ? `<div class="field grow"><span class="lbl">תמונה <span style="font-weight:300;opacity:.5">(אופציונלי)</span></span>${f.image_url ? `<div class="thumb"><img src="${h(f.image_url)}" alt="הוצאה"><button data-a="rmimg" aria-label="הסר תמונה">${ic('x', 'width:12px;height:12px;stroke-width:2')}</button></div>` : `<button type="button" class="dash" data-a="pickimg" ${S.busy.up ? 'disabled' : ''}>${ic('upload', 'width:14px;height:14px')}<span>${S.busy.up ? 'מעלה...' : 'הוסף'}</span></button>`}</div>` : ''}</div>

/* ---------- trips ---------- */
const blankTrip = () => ({name:'', destination:'', start_date:'', end_date:'', budget:'', currency:'ILS', ratesOpen:false, rates:{...DEF_RATES}, badEnd:false});
function vTrips() {
  const all = e => S.expenses.filter(x => x.trip_id === e).reduce((s, x) => s + (x.amount || 0), 0), o = {active:0, completed:1, planned:2};
  const sorted = [...S.trips].sort((a, b) => (o[a.status] ?? 2) !== (o[b.status] ?? 2) ? (o[a.status] ?? 2) - (o[b.status] ?? 2) : a.status === 'completed' && b.status === 'completed' ? (b.end_date || '').localeCompare(a.end_date || '') : 0);
  return head('ארכיון', 'כל הטיולים') + (S.newTrip ? newTripForm(S.newTrip) : '') +
    (!S.trips.length && !S.newTrip ? `<div class="center" style="min-height:40vh"><div class="tile" style="width:56px;height:56px">${ic('folder')}</div><p class="sub" style="font-size:14px">אין טיולים עדיין</p><p class="sub" style="font-size:12px;opacity:.6;margin-top:4px">לחץ + כדי ליצור טיול</p></div>` : `<div style="display:flex;flex-direction:column;gap:12px">${sorted.map(t => tripCard(t, all(t.id))).join('')}</div>`) +
    `<button class="fab" data-a="fab" aria-label="${S.newTrip ? 'סגור' : 'טיול חדש'}">${ic(S.newTrip ? 'x' : 'plus')}</button>`;
}
const dateBox = (id, v, bind, min) => `<div class="datebox"><div class="face" style="color:${v ? 'var(--ink)' : 'var(--line)'}">${v ? dmy(v) : 'dd/mm/yyyy'}</div>${v ? `<button type="button" class="clr" data-a="clrdate" data-v="${bind}" aria-label="נקה תאריך">${ic('x')}</button>` : ic('cal')}<input type="date" id="${id}" data-c="ntdate" data-v="${bind}" value="${v}" ${min ? `min="${min}"` : ''}></div>`;
const ratesBox = (r, key, close) => `<div class="inl"><p class="sub">שערי מטבע עבור הטיול הזה (₪ ל-1 יחידה)</p>${CUR.filter(c => c.code !== 'ILS').map(c => `<div class="row"><div style="width:32px;height:32px;border-radius:8px;background:rgba(10,31,68,.05);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--navy);flex:none">${c.symbol}</div><span style="font-size:12px;color:var(--mute);flex:none">1 ${c.code} =</span><input class="small-in grow" type="number" step="0.01" id="r-${key}-${c.code}" data-rate="${key}" data-v="${c.code}" value="${r[c.code] ?? ''}" aria-label="שער ${c.label}"><span style="font-size:12px;opacity:.4">₪</span></div>`).join('')}${close ? `<div class="row"><button class="btn ${S.card[key] && S.card[key].saved ? 'secondary' : 'goldb'} grow" style="padding:8px;font-size:12px" data-a="saverates" data-v="${key}" ${S.busy['r' + key] ? 'disabled' : ''}>${ic(S.card[key] && S.card[key].saved ? 'check' : 'refresh', 'width:14px;height:14px')}<span>${S.busy['r' + key] ? 'מעדכן...' : S.card[key] && S.card[key].saved ? 'נשמר!' : 'שמור שערים'}</span></button><button class="btn secondary" style="padding:8px 16px;font-size:12px" data-a="cardclose" data-v="${key}">סגור</button></div>` : ''}</div>`;
function newTripForm(n) {
  return `<div class="card gold"><h3 class="h3" style="margin-bottom:16px">טיול חדש</h3><div style="display:flex;flex-direction:column;gap:12px">
    <div class="field"><label class="lbl" for="n-name">שם הטיול</label><input class="in" id="n-name" data-m="newTrip.name" placeholder="למשל: רומא 2025" value="${h(n.name)}"></div>
    <div class="field"><label class="lbl" for="n-dest">יעד</label><input class="in" id="n-dest" data-m="newTrip.destination" placeholder="עיר / מדינה" value="${h(n.destination)}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="field"><label class="lbl" for="n-start">תאריך התחלה</label>${dateBox('n-start', n.start_date, 'start_date')}</div><div class="field"><label class="lbl" for="n-end">תאריך סיום</label>${dateBox('n-end', n.end_date, 'end_date', n.start_date)}${n.badEnd ? '<p style="margin:0;font-size:11px;color:#ef4444;font-weight:500">תאריך סיום לא תקין. נסה שוב!</p>' : ''}</div></div>
    <div style="display:grid;grid-template-columns:1fr auto 2fr;gap:8px;align-items:end"><div class="field" style="gap:4px"><label class="sub" style="font-size:9px" for="n-budget">תקציב</label><input class="in" style="height:44px;padding:0 8px" id="n-budget" type="number" placeholder="0" data-m="newTrip.budget" value="${h(n.budget)}"></div><div class="field" style="gap:4px"><span class="sub" style="font-size:9px;white-space:nowrap">ברירת מחדל</span>${curSel('n-cur', n, 'newTrip')}</div><div class="field" style="gap:4px"><span class="sub" style="font-size:9px">שערי מטבע</span><button type="button" data-a="ntrates" style="height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:500;border:1px solid ${n.ratesOpen ? 'var(--gold)' : 'rgba(201,164,91,.4)'};background:${n.ratesOpen ? 'var(--gold)' : 'rgba(201,164,91,.1)'};color:${n.ratesOpen ? '#fff' : 'var(--gold)'}">${ic('coins', 'width:14px;height:14px')}שערי מטבע</button></div></div>
    ${n.ratesOpen ? ratesBox(n.rates, '__new__', false) : ''}

  </div></div>`;

function tripCard(t, total) {

    ${t.destination ? `<div class="row" style="gap:6px;margin-bottom:8px;color:color-mix(in srgb,var(--mute) 60%,transparent)">${ic('pin', 'width:12px;height:12px')}<span style="font-size:12px;font-weight:300">${h(t.destination)}</span></div>` : ''}
    <div class="row" style="gap:16px"><p class="big navy">₪${total.toLocaleString()}</p>${t.start_date ? `<div class="row" style="gap:4px;color:color-mix(in srgb,var(--mute) 40%,transparent)">${ic('cal', 'width:12px;height:12px')}<span style="font-size:10px;font-weight:300">${dmy(t.start_date, 'yy')}${t.end_date ? ' — ' + dmy(t.end_date, 'yy') : ''}</span></div>` : ''}</div>
    </div>${c.mode === 'rename' ? '' : `<button class="kebab" style="padding:8px;border-radius:10px" data-a="tmenu" data-v="${t.id}" aria-label="פעולות">${ic('kebab')}</button>`}</div>
    ${c.mode === 'rates' ? ratesBox(c.rates, t.id, true) : ''}
    ${c.mode === 'cur' ? `<div class="inl"><div class="row"><span style="font-size:11px;font-weight:500;opacity:.6;flex:none">מטבע ברירת מחדל:</span><select class="small-in" id="dc-${t.id}" data-card="${t.id}" data-v="currency" style="min-width:72px">${CUR.map(x => `<option ${x.code === c.currency ? 'selected' : ''}>${x.code}</option>`).join('')}</select><button class="row" style="gap:4px;padding:6px 10px;border-radius:8px;background:var(--gold);color:#fff;font-size:12px;font-weight:500" data-a="savecur" data-v="${t.id}">${ic('check', 'width:12px;height:12px;stroke-width:2')}שמור</button><button class="sq" style="padding:6px;border-radius:8px;background:var(--bg);color:var(--mute)" data-a="cardclose" data-v="${t.id}" aria-label="סגור">${ic('x', 'width:12px;height:12px;stroke-width:2')}</button></div></div>` : ''}
    ${c.mode === 'dates' ? `<div class="inl"><p class="flbl" style="margin:0;font-size:11px">שינוי תאריכי טיול</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="field" style="gap:4px"><label style="font-size:10px;font-weight:500;color:var(--mute)" for="ds-${t.id}">תאריך התחלה</label><input type="date" class="small-in" id="ds-${t.id}" data-card="${t.id}" data-v="start_date" value="${c.start_date}"></div><div class="field" style="gap:4px"><label style="font-size:10px;font-weight:500;color:var(--mute)" for="de-${t.id}">תאריך סיום</label><input type="date" class="small-in" id="de-${t.id}" data-card="${t.id}" data-v="end_date" min="${c.start_date}" value="${c.end_date}"></div></div><div class="row"><button class="row grow" style="justify-content:center;gap:6px;padding:8px;border-radius:9px;background:var(--gold);color:#fff;font-size:12px;font-weight:500" data-a="savedates" data-v="${t.id}" ${S.busy['d' + t.id] ? 'disabled' : ''}>${ic('check', 'width:14px;height:14px;stroke-width:2')}${S.busy['d' + t.id] ? 'שומר...' : 'שמור תאריכים'}</button><button style="padding:8px 12px;border-radius:9px;background:var(--bg);color:var(--mute);font-size:12px;font-weight:500" data-a="cardclose" data-v="${t.id}">ביטול</button></div></div>` : ''}
  </div>`;
}

/* ---------- settings ---------- */

  const r = S.rem, wheel = (k, items, label) => `<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span class="flbl">${label}</span><div class="wheel"><div class="sc" data-k="${k}" tabindex="0" aria-label="${label}">${items.map(v => `<div class="it ${v === r[k] ? 'on' : ''}">${String(v).padStart(2, '0')}</div>`).join('')}</div></div></div>`;
  return head('הגדרות', 'ניהול') + `
  <div class="card gold"><div class="row" style="align-items:flex-start;gap:12px"><div class="ico" style="width:40px;height:40px;border-radius:12px;background:rgba(10,31,68,.05);color:rgba(10,31,68,.5)">${ic('luggage', 'width:20px;height:20px')}</div><div><h3 style="margin:0 0 2px;font-size:14px;font-weight:600">מנהל הוצאות טיולים</h3><p class="sub" style="font-size:12px;line-height:1.6">גרסת Premium Business — ניהול יוקרתי ומקצועי של הוצאות הטיולים שלך.</p></div></div></div>
  <div class="card"><button class="row w100" style="text-align:right" data-a="remtoggle" aria-expanded="${r.open}">${ic('bell', 'color:var(--gold)')}<h3 class="h3 grow" style="color:var(--navy)">תזכורת יומית</h3>${ic('down', `color:color-mix(in srgb,var(--mute) 40%,transparent);transition:transform .2s;transform:rotate(${r.open ? 180 : 0}deg)`)}</button>
    ${r.open ? `<div style="margin-top:16px;border-top:1px solid rgba(10,31,68,.1);padding-top:16px;display:flex;flex-direction:column;gap:16px"><div><p class="sub" style="font-size:12px;line-height:1.6;opacity:1">תזכורת תישלח למייל בשעה שהוגדרה — רק בימים שנמצאים בטווח טיול פעיל.</p><p style="margin:0;font-size:11px;color:rgba(201,164,91,.9);padding:8px 12px;line-height:1.6">⚠️ שליחת המייל עדיין לא מחוברת בגרסה הזו. ההגדרות נשמרות בלבד.</p></div>
      <div class="field"><label class="lbl" for="rem-email">כתובת אימייל</label><input class="in" style="padding:10px 12px;direction:ltr" type="email" id="rem-email" data-m="rem.email" placeholder="your@email.com" value="${h(r.email)}"></div>
      <div class="field"><span class="lbl">שעת שליחה</span><div class="row" dir="ltr" style="justify-content:center;gap:12px;padding:8px 0">${wheel('hour', Array.from({length: 24}, (_, i) => i), 'שעה')}<span style="font-size:24px;font-weight:300;opacity:.3;margin-top:20px">:</span>${wheel('minute', [0, 15, 30, 45], 'דקות')}</div></div>
      <div class="between"><span class="lbl">הפעל תזכורות</span><div dir="ltr"><button class="sw ${r.enabled ? 'on' : ''}" data-a="remsw" role="switch" aria-checked="${r.enabled}" aria-label="הפעל תזכורות"></button></div></div>
      <button class="btn w100" id="rem-save" style="background:var(--navy);color:#fff;padding:10px;border-radius:10px" data-a="remsave" ${S.busy.rem || !r.email ? 'disabled' : ''}>${r.saved ? ic('check', 'stroke-width:2') + '<span>נשמר!</span>' : S.busy.rem ? 'שומר...' : 'שמור הגדרות תזכורת'}</button></div>` : ''}
  </div>
  <div class="card"><div style="border-bottom:1px solid rgba(10,31,68,.1);padding-bottom:12px;margin-bottom:16px"><h3 class="h3" style="color:var(--navy)">אזור מתקדם</h3></div><button class="btn danger w100" data-a="askreset" ${S.busy.reset ? 'disabled' : ''}>${ic('trash')}<span>${S.busy.reset ? 'מאפס...' : 'איפוס כל הנתונים'}</span></button></div>`;
}

/* ---------- floating layer ---------- */
function vLayer() {
  let o = '';
  if (S.menu) {
    const m = S.menu, pos = `top:${m.top}px;right:${m.right}px`;
    if (m.type === 'e') { const e = S.expenses.find(x => x.id === m.id); if (e) o += `<div class="menu" style="${pos};min-width:160px">${e.notes ? `<button data-a="note" data-v="${e.id}">${ic('note', 'color:var(--gold)')}<span>${S.note && S.note.id === e.id ? 'הסתר הערה' : 'הצג הערה'}</span></button>` : ''}${e.image_url ? `<button data-a="img" data-v="${e.id}">${ic('image', 'color:var(--blue)')}<span>הצג תמונה</span></button>` : ''}<button data-a="edit" data-v="${e.id}">${ic('pencil')}<span>עריכה</span></button><hr><button class="del" data-a="delexp" data-v="${e.id}">${ic('trash')}<span>מחיקה</span></button></div>`; }
    else { const t = S.trips.find(x => x.id === m.id); if (t) o += `<div class="menu" style="${pos};width:208px"><button data-a="tm" data-v="rename">${ic('pencil')}<span>שנה שם</span></button>${m.status ? `<div class="subm"><p class="flbl" style="margin:0;padding:4px 12px">בחר סטטוס</p>${['active', 'completed'].filter(s => s !== t.status).map(s => `<button data-a="tm" data-v="toggle" style="padding:8px 12px">${ic('check', 'width:12px;height:12px;color:var(--gold)')}<span>${STATUS[s]}</span></button>`).join('')}<button data-a="tm" data-v="back" style="padding:6px 12px;font-size:12px;opacity:.5">← חזור</button></div>` : `<button data-a="tm" data-v="status">${ic('swap')}<span>שינוי סטטוס</span></button>`}<button data-a="tm" data-v="rates">${ic('coins', 'color:var(--gold)')}<span>עדכון שערי מטבע</span></button><button data-a="tm" data-v="cur">${ic('dollar', 'color:var(--gold)')}<span>עדכון מטבע ברירת מחדל</span></button><button data-a="tm" data-v="dates">${ic('cal')}<span>שינוי תאריכים</span></button><button data-a="tm" data-v="dup">${ic('copy')}<span>שכפל טיול</span></button><hr><button class="del" data-a="tm" data-v="del">${ic('trash')}<span>מחק טיול</span></button></div>`; }
  }
  if (S.note) { const e = S.expenses.find(x => x.id === S.note.id); if (e && e.notes) o += `<div class="note" style="top:${S.note.top}px;left:${S.note.left}px"><div>${h(e.notes).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')}</div><button data-a="noteclose" aria-label="סגור">${ic('x', 'width:12px;height:12px;stroke-width:2;opacity:.4')}</button></div>`; }

    const p2 = `<div style="${wrap}"><div style="background:#0A1F44;padding:14px 30px;"><span style="font-size:16px;font-weight:bold;color:white;">סיכום לפי קטגוריה</span></div><div style="display:flex;align-items:center;gap:24px;padding:20px 30px;"><img src="${cv.toDataURL('image/png')}" width="200" height="200" style="flex-shrink:0;"><table style="flex:1;border-collapse:collapse;"><thead><tr style="background:#0A1F44;"><th style="${th2}text-align:right;">קטגוריה</th><th style="${th2}text-align:center;">אחוז</th><th style="${th2}text-align:left;">סכום</th></tr></thead><tbody>${by.map(([c, v], i) => `<tr><td style="padding:6px 12px;vertical-align:middle;"><div style="display:inline-block;width:12px;height:12px;background:${PIE[i % 8]};border-radius:3px;vertical-align:middle;margin-left:6px;"></div><span style="font-size:12px;color:#33363D;vertical-align:middle;">${h(catInfo(c).label)}</span></td><td style="padding:6px 12px;font-size:12px;color:#50535A;text-align:center;">${total > 0 ? (v / total * 100).toFixed(1) : '0'}%</td><td style="padding:6px 12px;font-size:12px;font-weight:bold;color:#0A1F44;text-align:left;">₪${il(v)}</td></tr>`).join('')}</tbody></table></div></div>`;
    const shot = async html => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;top:-9999px;left:-9999px;z-index:-1'; d.innerHTML = html; document.body.appendChild(d); const c = await html2canvas(d, {scale: 2, useCORS: true, backgroundColor: '#ffffff', width: 794}); d.remove(); return c; };
    const pdf = new jspdf.jsPDF({orientation: 'portrait', unit: 'pt', format: 'a4'}), W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
    const put = (c, np) => { const ph = c.height * W / c.width, img = c.toDataURL('image/png'); let left = ph, y = 0; if (np) pdf.addPage(); pdf.addImage(img, 'PNG', 0, y, W, ph); left -= H; while (left > 0) { y -= H; pdf.addPage(); pdf.addImage(img, 'PNG', 0, y, W, ph); left -= H; } };
    put(await shot(p1), false); put(await shot(p2), true);
    await downloads.save({filename: `${(t.name || 'trip').replace(/\s+/g, '_')}_expenses.pdf`, data: pdf.output('blob')});
  } catch (e) { if (!e || e.code !== 'declined') { console.error(e); toast('ייצוא ה-PDF נכשל'); } }
}

render();
init();
})();
</script>

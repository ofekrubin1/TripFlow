# Netlify builds and redeploys on every push to main.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: let the client router handle /plan, /trips, /settings.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Server functions: daily email reminder (scheduled) and the Settings "send test email" button.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
